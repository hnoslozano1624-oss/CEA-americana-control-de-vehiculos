# ============================================================
# Escuela Americana de Conducción - Control de Vehículos
# Configuración Cloudflare Pages + Workers + D1 + R2
# ============================================================

name = "escuela-conduccion"
compatibility_date = "2024-01-15"
pages_build_output_dir = "public"

# ---- Base de Datos D1 (SQLite en Cloudflare) ---------------
[[d1_databases]]
binding = "DB"
database_name = "escuela_conduccion_db"
database_id = "aeacf8ed-04bd-40f1-853e-c40fc7836e54"
migrations_dir = "migrations"

# ---- Almacenamiento de Fotos R2 ----------------------------
# R2 desactivado en fase gratuita. Las fotos se almacenan como base64 en D1.
# Cuando se apruebe el plan, descomentar y crear el bucket:
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "escuela-conduccion-fotos"

# ---- Inteligencia Artificial (comparación de fotos) --------
[ai]
binding = "AI"

# ---- Variables de Entorno ----------------------------------
[vars]
JWT_SECRET = "CAMBIAR_POR_CLAVE_SEGURA_ALEATORIA"   # Generar en: https://generate-secret.vercel.app/32
APP_NAME = "Control Vehículos - Escuela Americana"
DIAS_ALERTA_DOCUMENTOS = "30"
DIAS_ALERTA_MANTENIMIENTO = "15"
